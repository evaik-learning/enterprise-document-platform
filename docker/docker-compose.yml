version: '3.9'

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - '7000:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - template-api

  template-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.template.api
    ports:
      - '7003:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  digital-signature-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.digital-signature.api
    ports:
      - '7009:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SigningDb: Server=host.docker.internal;Database=EnterpriseDocumentPlatform_Signing;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
      ConnectionStrings__ServiceBus: ''
      ConnectionStrings__Storage: UseDevelopmentStorage=true
    depends_on:
      - template-api

