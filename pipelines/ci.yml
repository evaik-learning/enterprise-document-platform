trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

variables:
- template: variables/dev.yml
- name: dotnetSdkVersion
  value: '10.x'
- name: nodeVersion
  value: '22.x'
- name: solution
  value: 'EnterpriseDocumentPlatform.sln'
- name: webAppProject
  value: 'src/Web/Edp.Web'
- name: buildConfiguration
  value: 'Release'

stages:
- template: templates/build-and-test.yml
- template: templates/deploy-azure.yml
  parameters:
    environmentName: 'dev'
    parameterFile: 'infra/dev.bicepparam'
    # Set the Azure service connection name in your Azure DevOps project.
    serviceConnection: 'AzureServiceConnection'
    resourceGroupName: 'rg-edp-platform-dev'
    location: 'eastus'
    webAppArtifactPath: '$(Pipeline.Workspace)/frontend-dist'
    backendImageName: 'edp-gateway'
    containerRegistry: 'edpacrdev'
