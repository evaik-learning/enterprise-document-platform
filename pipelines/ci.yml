# Continuous integration: validates every pull request and feature branch. It never deploys.
# Create the pipeline in Azure DevOps from this file (see pipelines/README.md).
trigger:
  branches:
    include:
      - feature/*
      - bugfix/*

pr:
  branches:
    include:
      - main
      - develop

variables:
- template: variables/common.yml

stages:
- template: templates/build-and-test.yml
