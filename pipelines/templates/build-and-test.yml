stages:
- stage: Build
  displayName: Build and test
  jobs:
  - job: Backend
    displayName: .NET build, test and dependency audit
    pool:
      vmImage: $(vmImage)
    steps:
    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - script: dotnet restore $(solution)
      displayName: Restore

    - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
      displayName: Build

    - script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/test-results
      displayName: Unit tests

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/test-results/*.trx'
        failTaskOnFailedTests: true

    - script: |
        dotnet list $(solution) package --vulnerable --include-transitive 2>&1 | tee $(Agent.TempDirectory)/vulnerabilities.txt
        if grep -q "has the following vulnerable packages" $(Agent.TempDirectory)/vulnerabilities.txt; then
          echo "##vso[task.logissue type=error]Vulnerable NuGet packages found (see log)."
          exit 1
        fi
      displayName: NuGet vulnerability audit

  - job: Frontend
    displayName: Web lint, type-check, test and build
    pool:
      vmImage: $(vmImage)
    steps:
    - task: NodeTool@0
      displayName: Install Node.js
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm --prefix $(webAppProject) ci
      displayName: Install dependencies

    - script: npm --prefix $(webAppProject) run lint
      displayName: Lint

    - script: npm --prefix $(webAppProject) run typecheck
      displayName: Type-check

    - script: npm --prefix $(webAppProject) run test
      displayName: Unit and component tests

    - script: npm --prefix $(webAppProject) run build
      displayName: Production build

    - script: npm --prefix $(webAppProject) audit --omit=dev --audit-level=high
      displayName: npm vulnerability audit (production dependencies)
